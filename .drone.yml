kind: pipeline
type: docker
name: build

concurrency:
  limit: 1

steps:
  - name: docker-build
    image: plugins/docker
    settings:
      dockerfile: ./Dockerfile
      repo: dock.your-registry.io/web/mountain-retreat
      registry: dock.your-registry.io
      tags:
      - ${DRONE_COMMIT_SHA}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event:
      - push
  - name: deploy
    image: quay.io/rythm-bot/drone-kubernetes
    settings:
      kubernetes_server:
        from_secret: kube_host
      kubernetes_cert:
        from_secret: kube_ca_cert
      kubernetes_token:
        from_secret: kube_service_token
      namespace: web
      deployment: mountain-retreat
      container: mountain-retreat
      repo: dock.your-registry.io/web/mountain-retreat
      tag: ${DRONE_COMMIT_SHA}
    when:
      branch:
      - master
      event:
      - push
